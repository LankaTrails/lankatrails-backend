# Local development infrastructure for lankatrails-backend.
#
#   cp .env.example .env          # once; fill in secrets
#   docker compose -f docker-compose.dev.yml up -d
#   ./mvnw spring-boot:run
#
# Compose reads the same .env as Spring Boot (spring-dotenv), so credentials,
# hosts and ports stay aligned with application.properties. Every port is bound
# to 127.0.0.1 so nothing is exposed on the local network.

name: lankatrails

services:
  postgres:
    # The official PostGIS image is amd64-only; Docker Desktop emulates it on Apple Silicon.
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${DB_NAME:-lankatrails}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_DATABASE: lankatrails
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-lankatrails}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-lankatrails}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    # AMQP (5672) for Spring AMQP, STOMP (61613) for the WebSocket broker relay,
    # management UI on http://localhost:15672
    image: rabbitmq:3.13-management-alpine
    environment:
      # Not "guest": RabbitMQ only allows guest over loopback, and container traffic is not loopback.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-lankatrails}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-lankatrails}
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_STOMP_PORT:-61613}:61613"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  rabbitmq_data:
